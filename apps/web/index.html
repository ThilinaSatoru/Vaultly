<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08090c" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Vaultly · A world within your vault</title>
    <style>
      .boot-loading{min-height:100vh;display:grid;place-content:center;text-align:center;background:#111315;color:#e6edf3;font:16px system-ui}
      .boot-spinner{width:32px;height:32px;margin:0 auto 18px;border:3px solid #343b44;border-top-color:#a9c8ec;border-radius:50%;animation:boot-spin 1s linear infinite}
      @keyframes boot-spin{to{transform:rotate(360deg)}}
      @media(prefers-reduced-motion:reduce){.boot-spinner{animation:none}}
    </style>
  </head>
  <body>
    <div id="root"><div class="boot-loading" role="status" aria-live="polite"><div class="boot-spinner" aria-hidden="true"></div><h1>Vaultly</h1><p>Opening your library…</p></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
